name: Build

on:
  push:
  pull_request:

jobs:
  build:
    strategy:
      # Every system runs to the end: one failure does not hide the others.
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            qt_arch: win64_msvc2022_64
          - os: macos-latest
            qt_arch: clang_64
          - os: ubuntu-latest
            qt_arch: linux_gcc_64
            warnings_as_errors: 'ON'  # GCC: the same warnings as the developers' MinGW build
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06  # v4.5.0
        with:
          version: '6.8.3'
          arch: ${{ matrix.qt_arch }}
          cache: true
      - uses: lukka/get-cmake@30aea713799f46b5b60e60f5fa83f849abd52c22  # v4.5.0-rc3 (was @latest)
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DMENTIS_BUILD_BENCHMARKS=ON -DMENTIS_WARNINGS_AS_ERRORS=${{ matrix.warnings_as_errors || 'OFF' }}
      - name: Build
        run: cmake --build build --config Release
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Benchmark smoke
        if: runner.os == 'Linux'
        run: ./build/MentisBenchmark 1000
      - name: Deterministic UI snapshot
        if: runner.os == 'Linux'
        run: |
          xvfb-run -a ./build/Mentis --ui-snapshot build/ui-home.png
          test -s build/ui-home.png
